name: Android CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.package-release.outputs.version || steps.package-unsigned.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android 16 SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Test packaging and attribution safeguards
        run: |
          ./scripts/test-package.sh
          python3 scripts/test_verify_open_source.py
          python3 scripts/test_verify_ffmpeg.py
          python3 scripts/test_verify_metadata.py
          python3 scripts/test-location-metadata.py

      - name: Test, lint and package signed release
        id: package-release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.NATSUKO_KEYSTORE_BASE64 }}
          NATSUKO_STORE_PASSWORD: ${{ secrets.NATSUKO_STORE_PASSWORD }}
          NATSUKO_KEY_ALIAS: ${{ secrets.NATSUKO_KEY_ALIAS }}
          NATSUKO_KEY_PASSWORD: ${{ secrets.NATSUKO_KEY_PASSWORD }}
        run: |
          [[ -n "$KEYSTORE_BASE64" ]] || { echo "Tag releases require NATSUKO_KEYSTORE_BASE64." >&2; exit 1; }
          umask 077
          keystore_path="$RUNNER_TEMP/natsuko-release.jks"
          trap 'rm -f "$keystore_path"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          export NATSUKO_KEYSTORE="$keystore_path"
          ./scripts/package.sh --tag "$GITHUB_REF_NAME"

      - name: Test, lint and package unsigned verification build
        id: package-unsigned
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: ./scripts/package.sh --unsigned

      - name: Upload build artifacts, license notices and corresponding sources
        uses: actions/upload-artifact@v4
        with:
          name: natsuko-${{ steps.package-release.outputs.version || steps.package-unsigned.outputs.version }}
          path: dist/${{ steps.package-release.outputs.version || steps.package-unsigned.outputs.version }}/*
          if-no-files-found: error

      - name: Upload unit test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn

  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android 16 SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android 16 device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload Android device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, instrumentation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: natsuko-${{ needs.build.outputs.version }}
          path: release

      - name: Publish verified tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd release
          shasum -a 256 -c SHA256SUMS
          test "$GITHUB_REF_NAME" = "v$RELEASE_VERSION"
          grep -Fx "VERSION_NAME=$RELEASE_VERSION" BUILD_INFO.properties
          grep -Fx "SIGNING_STATUS=signed-release" BUILD_INFO.properties
          grep -Fx "RELEASE_TAG=$GITHUB_REF_NAME" BUILD_INFO.properties
          grep -Fx "GIT_COMMIT=$GITHUB_SHA" BUILD_INFO.properties

          # Publish an explicit list, never a glob. The workflow artifact also holds
          # the debug APK, AAB, R8 mapping and verification reports: build records,
          # not downloads. The source archive must stay next to the APK because it
          # is the corresponding source of the bundled LGPL code, and it already
          # contains LICENSE, NOTICE and THIRD_PARTY_NOTICES.md.
          apk="Natsuko-$RELEASE_VERSION.apk"
          sources="natsuko-third-party-sources-$RELEASE_VERSION.tar.gz"
          checksums="$RUNNER_TEMP/SHA256SUMS"
          shasum -a 256 "$apk" "$sources" > "$checksums"

          # The download page has to state the FFmpeg/LGPL use and point at the
          # matching source archive; see docs/native_licenses.md.
          {
            printf '\n---\n\n### 附件说明\n\n'
            printf -- '- `%s`：已签名安装包，适用于 Android 16 及以上系统。\n' "$apk"
            printf -- '- `%s`：本软件使用 FFmpeg，依 LGPL 2.1 或后续版本分发；该压缩包提供本版本内置第三方组件的对应源码、重建资料与许可证声明，仅安装使用无需下载。\n' "$sources"
            printf -- '- `SHA256SUMS`：以上两个文件的 SHA-256 校验和。\n'
          } >> RELEASE_NOTES.md

          # A failed upload can be retried while the release is still a draft.
          # Published assets are never replaced by a workflow rerun.
          if is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')"; then
            [[ "$is_draft" == true ]] || { echo "Release already published; refusing to replace its assets." >&2; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$GITHUB_REF_NAME" "$apk" "$sources" "$checksums" --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
